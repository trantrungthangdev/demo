<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault - Trash System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: sans-serif; overflow: hidden; }
        .loader { border: 3px solid #27272a; border-top: 3px solid #ef4444; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .input-dark { background-color: #18181b; border: 1px solid #27272a; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const CONFIG = {
            SUPABASE_URL: 'https://cmxvxxkgggmiibaybztcq.supabase.co',
            SUPABASE_ANON_KEY: 'sb_publishable_7CrnCBglYawn7vIU8z6oqQ_yntv7K4W',
            ADMIN_USER: 'admin000',
            ADMIN_PASS: 'admin111admin'
        };

        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        const App = () => {
            const [isLogged, setIsLogged] = useState(false);
            const [videos, setVideos] = useState([]);
            const [loading, setLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [playing, setPlaying] = useState(null);
            const [tab, setTab] = useState('main'); // 'main' hoặc 'trash'

            const fetchVideos = async () => {
                setLoading(true);
                const isDeleted = (tab === 'trash');
                const { data, error } = await supabaseClient
                    .from('private_videos')
                    .select('*')
                    .eq('is_deleted', isDeleted)
                    .order('created_at', { ascending: false });
                if (!error) setVideos(data);
                setLoading(false);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                const fileName = `${Date.now()}_${file.name}`;
                const { data, error: upError } = await supabaseClient.storage.from('videos').upload(fileName, file);
                
                if (upError) {
                    alert("Lỗi: " + upError.message + " (Kiểm tra giới hạn file size trên Supabase)");
                    setUploading(false);
                    return;
                }

                const { data: { publicUrl } } = supabaseClient.storage.from('videos').getPublicUrl(fileName);
                await supabaseClient.from('private_videos').insert([{ name: file.name, url: publicUrl, is_deleted: false }]);
                fetchVideos();
                setUploading(false);
            };

            const moveToTrash = async (id) => {
                await supabaseClient.from('private_videos').update({ is_deleted: true }).eq('id', id);
                fetchVideos();
            };

            const restoreVideo = async (id) => {
                await supabaseClient.from('private_videos').update({ is_deleted: false }).eq('id', id);
                fetchVideos();
            };

            const permanentlyDelete = async (id, url) => {
                if (!confirm("Xóa vĩnh viễn không thể khôi phục?")) return;
                const fileName = url.split('/').pop();
                await supabaseClient.storage.from('videos').remove([fileName]);
                await supabaseClient.from('private_videos').delete().eq('id', id);
                fetchVideos();
            };

            useEffect(() => { if (isLogged) fetchVideos(); }, [isLogged, tab]);

            if (!isLogged) return <Login onLogin={() => setIsLogged(true)} />;

            return (
                <div className="h-screen flex flex-col bg-zinc-950">
                    <nav className="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900">
                        <div className="flex items-center gap-6">
                            <h1 className="text-red-600 font-bold text-xl">VAULT</h1>
                            <div className="flex bg-black rounded-lg p-1 scale-90">
                                <button onClick={() => setTab('main')} className={`px-4 py-1 rounded-md text-xs ${tab === 'main' ? 'bg-zinc-800 text-white' : 'text-zinc-500'}`}>VIDEO</button>
                                <button onClick={() => setTab('trash')} className={`px-4 py-1 rounded-md text-xs ${tab === 'trash' ? 'bg-red-900 text-white' : 'text-zinc-500'}`}>THÙNG RÁC</button>
                            </div>
                        </div>
                        <label className="bg-red-600 px-4 py-1.5 rounded-lg text-sm font-bold cursor-pointer hover:bg-red-700 transition">
                            {uploading ? <div className="loader"></div> : "+ UPLOAD"}
                            <input type="file" className="hidden" accept="video/*" onChange={handleFileUpload} disabled={uploading} />
                        </label>
                    </nav>

                    <main className="flex-1 overflow-y-auto p-6">
                        {loading ? <div className="flex justify-center py-20"><div className="loader"></div></div> : (
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                {videos.map(v => (
                                    <div key={v.id} className="bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800 group relative">
                                        <div onClick={() => setPlaying(v)} className="aspect-video bg-black flex items-center justify-center cursor-pointer">
                                            <span className="text-zinc-700 group-hover:text-red-600 transition">▶</span>
                                        </div>
                                        <div className="p-3 bg-zinc-900 border-t border-zinc-800 flex flex-col gap-2">
                                            <span className="text-[10px] truncate text-zinc-400">{v.name}</span>
                                            <div className="flex justify-between">
                                                {tab === 'main' ? (
                                                    <button onClick={() => moveToTrash(v.id)} className="text-[10px] text-zinc-500 hover:text-red-500">Bỏ vào thùng rác</button>
                                                ) : (
                                                    <>
                                                        <button onClick={() => restoreVideo(v.id)} className="text-[10px] text-green-500 hover:underline">Khôi phục</button>
                                                        <button onClick={() => permanentlyDelete(v.id, v.url)} className="text-[10px] text-red-600 hover:underline font-bold">Xóa hẳn</button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {playing && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex flex-col p-4">
                            <button onClick={() => setPlaying(null)} className="self-end text-white bg-red-600 px-3 py-1 rounded mb-4 text-xs font-bold">ĐÓNG [X]</button>
                            <video src={playing.url} controls autoPlay className="flex-1 w-full max-w-5xl mx-auto rounded-lg shadow-2xl" />
                        </div>
                    )}
                </div>
            );
        };

        const Login = ({ onLogin }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            return (
                <div className="h-screen flex items-center justify-center bg-black">
                    <form onSubmit={e => { e.preventDefault(); if(u===CONFIG.ADMIN_USER && p===CONFIG.ADMIN_PASS) onLogin(); else alert("Sai!"); }} className="w-80 p-8 bg-zinc-900 rounded-2xl border border-zinc-800">
                        <h2 className="text-center mb-6 font-bold text-red-600">VAULT LOGIN</h2>
                        <input className="input-dark w-full p-3 rounded-lg mb-3 text-sm" placeholder="User" onChange={e=>setU(e.target.value)} />
                        <input type="password" className="input-dark w-full p-3 rounded-lg mb-6 text-sm" placeholder="Pass" onChange={e=>setP(e.target.value)} />
                        <button className="w-full bg-red-600 py-3 rounded-lg font-bold">VÀO KHO PHIM</button>
                    </form>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
