<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Private Vault</title>
    <script type="text/javascript" src="https://www.dropbox.com/static/api/2/dropins.js" id="dropboxjs" data-app-key="mp6bqg9h16d1s5z"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dropbox SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dropbox.js/10.34.0/Dropbox-sdk.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #09090b;
            color: #e4e4e7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .loader {
            border: 3px solid #27272a;
            border-top: 3px solid #ef4444;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .input-dark {
            background-color: #18181b;
            border: 1px solid #27272a;
            color: white;
            transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CẤU HÌNH HỆ THỐNG (DÁN TOKEN CỦA BẠN VÀO ĐÂY)
        // ==========================================
        const CONFIG = {
            // Access Token từ Dropbox Developer Console
            ACCESS_TOKEN: 'sl.u.AGEi8JKDqtPySksKG2QVGb-jrZmam_15uDwhoAYnDhj4FGCK459dlKPcC4siRyh4NTCVNtQnmYtU5ubOiba0zEu2DTFXIME1ZAytUPd_QXi71q88ySxp4rML-DG1WLzm4Qfdgu5rU0tEhpXdzdPQrdWr7JU4cTV9qbjLtOPpo8CHhBNyiy2ZG-ePnhfUmLbZBWgPAygN3KzVANjpu1gTekxd3GjW9aLMBGgtdYp2H_n59161FjpL-lDoG1Wsnl08InJq8-2g0iZZmF7_5INXIQn2eXdRHchEOfUqhxf0ZtLPtHZNaw7283TM8Z7sXWF4BJITKd8Fjf-T2WVFDU_wDD4w3BWTft-GFo9xDobhfbn5NhSkcdBgrJ97_Ac0e-lEHVveDDFijEDhIkt6g3vQQNsv63_XTgJso_C9ufxUk73xD4JmqAfslLl6M_ydEUSxhCIfPGnkdIFL3thbmIKUSAXSxMmLCIkDdlw6NnzwCd7ZdHTW512wA_muXuR55GEl-Kb9bM2OhaTYtnjGkb1O8zNDKfjQYgXxQPTahm0eCIUKSV_kF3P5C4yAcBPwdTQFCJgwK0Ydssx94MSAqbg0Q6AOUzTkIRjfNnHZFbzZN9JA4PMgLyLJEaVzJK26GR5_6_jYTJw2yjK-FhHZwGxWSwGjZNfsUQDMZpREyJi3J_fHzrTbP4XVO1AvnyDNGoKHqa1IuChFujr4vGD_kn4niTUn4f7um5dIrMAY466WqDxFvA8SfMXlAsIvBXqIt5ocHpWtjQ2kiWXtJbLIT46aLBpBQzcaVr16K7KgffFCcgyRFAzbyzbigu1NCVrlLWLPKlAF6t0jkDN4uvb-CrhyjsOcfUuKJsCzq3IglOIZ-KOxAE_E9Oc5pp-_pa1w7H0xP_I-Qr8MuXJSct92ivBynjJVsR7AB7M_a8VLuRCv_GPZM4ddTtf504KdWZTqcz6LcnYLi5bIRenqxLV2tgYkm5cu0a4uZf1ldu0Kas2NxcXDTw0dZdtLGB9sUiW2L40G5c9243PazktDgKsZ78jLSgDmm9rlT_jqoq5ADMwRcp24f1e3nKVwopkbGPqgZ17-kiZWkZ1Q_H0g-vaCk9Q1R5jV9RgOMCtgD3WEV7rks46yHCgzWLbLxud0FOQOHFLZx9nT3d0eLGySKgn14E4_jL8kpiT0mckElF7URJ5OJByWMrcgW9dqRVVGx6KVuDZhMdKsoKPrxRqOjsRN3zYhNz_CJZFrsDcp6qE3-ZmKH-_pf2GcBbQrMgJjyB_7JpIZl-g1Vjpu9VyuW6v6bOY-NfYlV-zORgvxc5H6rCxi1igNcnjn_dxqe4hZ7H8EWrHHfV8pT2GsTW0HT7fKLXIIhXc4jWd9yrnc6j2dCG-b7zq4gbJJHYf6BNIbkrKEgEm2GWyfVkruiheJpdTaxZ_Yfd2b4s14vFXI7chI3keeZ0Ullg', 
            
            // Tài khoản đăng nhập
            ADMIN_USER: 'admin000',
            ADMIN_PASS: 'admin111admin'
        };

        const { useState, useEffect, useRef } = React;

        // --- Component: Icon Helper ---
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.setAttribute('width', size);
                    iconElement.setAttribute('height', size);
                    if (className) iconElement.setAttribute('class', className);
                    if (fill !== "none") iconElement.setAttribute('fill', fill);
                    
                    ref.current.innerHTML = '';
                    ref.current.appendChild(iconElement);
                    lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { class: className, width: size, height: size, fill: fill }
                    });
                }
            }, [name, size, className, fill]);
            return <span ref={ref} className="inline-flex items-center justify-center" style={{ width: size, height: size }}></span>;
        };

        // --- Component: Loading ---
        const Loading = () => <div className="flex justify-center p-4"><div className="loader"></div></div>;

        // --- Component: File Thumbnail ---
        const FileThumbnail = ({ dbx, file }) => {
            const [thumbUrl, setThumbUrl] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                let isMounted = true;
                const fetchThumbnail = async () => {
                    try {
                        const response = await dbx.filesGetThumbnail({
                            path: file.path_lower,
                            format: 'jpeg',
                            size: 'w640h480',
                            mode: 'strict'
                        });
                        if (isMounted) {
                            const url = URL.createObjectURL(response.result.fileBlob);
                            setThumbUrl(url);
                        }
                    } catch (error) {
                    } finally {
                        if (isMounted) setIsLoading(false);
                    }
                };
                fetchThumbnail();
                return () => { isMounted = false; };
            }, [file.id]);

            if (isLoading) return <div className="w-full h-full bg-zinc-900 animate-pulse flex items-center justify-center"><div className="w-6 h-6 border-2 border-zinc-700 border-t-zinc-500 rounded-full animate-spin"></div></div>;
            if (thumbUrl) return <img src={thumbUrl} alt={file.name} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />;
            return <div className="w-full h-full bg-zinc-900 flex flex-col items-center justify-center text-zinc-700 gap-2"><Icon name="film" size={32} /></div>;
        };

        // --- Main App ---
        const App = () => {
            const [view, setView] = useState('login');
            const [dbx, setDbx] = useState(null);
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = (user, pass) => {
                if (user === CONFIG.ADMIN_USER && pass === CONFIG.ADMIN_PASS) {
                    if (CONFIG.ACCESS_TOKEN.includes('HÃY_DÁN') || CONFIG.ACCESS_TOKEN === '') {
                        alert('CẢNH BÁO: Bạn chưa điền Dropbox Token vào code HTML!');
                        return;
                    }
                    try {
                        const dbxInstance = new Dropbox.Dropbox({ accessToken: CONFIG.ACCESS_TOKEN });
                        setDbx(dbxInstance);
                        setView('dashboard');
                    } catch (err) {
                        alert('Lỗi khởi tạo Dropbox SDK');
                    }
                } else {
                    alert('Sai tài khoản hoặc mật khẩu!');
                }
            };

            return (
                <div className="h-screen w-screen overflow-hidden flex flex-col relative bg-zinc-950 text-white">
                    {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                    {view === 'dashboard' && <Dashboard dbx={dbx} onLogout={() => setView('login')} showToast={showToast} />}
                    
                    {toast && (
                        <div className={`fixed bottom-4 right-4 z-[200] px-4 py-2 rounded shadow-lg text-sm font-medium animate-bounce ${toast.type === 'error' ? 'bg-red-900 text-red-200' : 'bg-zinc-800 text-white border border-zinc-700'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        // --- Login Screen ---
        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const submit = (e) => { e.preventDefault(); onLogin(user, pass); };

            return (
                <div className="flex items-center justify-center h-full w-full bg-black bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-zinc-900 to-black">
                    <form onSubmit={submit} className="w-full max-w-sm p-8 bg-zinc-950/80 backdrop-blur rounded-2xl border border-zinc-800 shadow-2xl mx-4">
                        <div className="text-center mb-8">
                            
                        </div>
                        <div className="space-y-4">
                            <div>
                               
                                <input type="text" value={user} onChange={e => setUser(e.target.value)} className="input-dark w-full p-3 rounded-lg text-sm" placeholder="Enter username" />
                            </div>
                            <div>
                          
                                <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="input-dark w-full p-3 rounded-lg text-sm" placeholder="Enter password" />
                            </div>
                            <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-all mt-2">CANCEL</button>
                        </div>
                    </form>
                </div>
            );
        };

        // --- Dashboard ---
        const Dashboard = ({ dbx, onLogout, showToast }) => {
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [uploading, setUploading] = useState(false);
            const [playing, setPlaying] = useState(null);
            const [search, setSearch] = useState('');
            const [isTrashMode, setIsTrashMode] = useState(false); // TRASH MODE STATE
            const fileInput = useRef(null);

            // Toggle Trash Mode
            const toggleTrash = () => {
                setIsTrashMode(!isTrashMode);
                setSearch(''); // Clear search when switching
            };

            const refresh = async () => {
                setLoading(true);
                try {
                    // Nếu ở chế độ Trash, lấy file từ thư mục /.trash, ngược lại lấy từ root (chuỗi rỗng)
                    const path = isTrashMode ? '/.trash' : '';
                    
                    const res = await dbx.filesListFolder({ path: path });
                    const mediaFiles = res.result.entries.filter(f => 
                        f['.tag'] === 'file' && 
                        /\.(mp4|mov|avi|mkv|webm|jpg|jpeg|png|gif|webp)$/i.test(f.name)
                    );
                    setFiles(mediaFiles.sort((a, b) => new Date(b.client_modified) - new Date(a.client_modified)));
                } catch (e) {
                    // Nếu lỗi là do thư mục trash chưa tồn tại, coi như thùng rác rỗng
                    if (isTrashMode && e.error && JSON.stringify(e.error).includes('not_found')) {
                         setFiles([]);
                    } else {
                        console.error(e);
                        showToast("Lỗi tải dữ liệu: " + (e.message || "Unknown"), "error");
                    }
                } finally {
                    setLoading(false);
                }
            };

            // Gọi refresh mỗi khi chuyển chế độ
            useEffect(() => { refresh(); }, [isTrashMode]);

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    await dbx.filesUpload({ path: '/' + file.name, contents: file });
                    showToast("Đã tải lên thành công!");
                    refresh();
                } catch (e) {
                    showToast("Lỗi tải lên: " + e.message, "error");
                } finally {
                    setUploading(false);
                    if (fileInput.current) fileInput.current.value = '';
                }
            };

            // LOGIC 1: Move to Trash (Soft Delete)
            const moveToTrash = async (file) => {
                if (!confirm("Chuyển vào thùng rác?")) return;
                try {
                    // Thử di chuyển file vào /.trash/filename
                    await dbx.filesMoveV2({
                        from_path: file.path_lower,
                        to_path: '/.trash/' + file.name
                    });
                    showToast("Đã chuyển vào thùng rác");
                    refresh();
                } catch (e) {
                    // Nếu lỗi do thư mục .trash chưa có, tạo nó rồi thử lại
                    if (JSON.stringify(e).includes('not_found')) {
                        try {
                            await dbx.filesCreateFolderV2({ path: '/.trash' });
                            // Retry move
                            await dbx.filesMoveV2({
                                from_path: file.path_lower,
                                to_path: '/.trash/' + file.name
                            });
                            showToast("Đã tạo thùng rác và di chuyển file");
                            refresh();
                        } catch (err2) {
                            showToast("Lỗi tạo thùng rác: " + err2.message, "error");
                        }
                    } else {
                        showToast("Lỗi xóa: " + e.message, "error");
                    }
                }
            };

            // LOGIC 2: Restore from Trash
            const restoreFile = async (file) => {
                if (!confirm("Khôi phục file này?")) return;
                try {
                    await dbx.filesMoveV2({
                        from_path: file.path_lower,
                        to_path: '/' + file.name // Move back to root
                    });
                    showToast("Đã khôi phục file");
                    refresh();
                } catch (e) {
                    showToast("Lỗi khôi phục: " + e.message, "error");
                }
            };

            // LOGIC 3: Permanent Delete
            const permanentDelete = async (path) => {
                if (!confirm("CẢNH BÁO: Hành động này không thể hoàn tác. Xóa vĩnh viễn?")) return;
                try {
                    await dbx.filesDeleteV2({ path });
                    setFiles(prev => prev.filter(f => f.path_lower !== path));
                    showToast("Đã xóa vĩnh viễn");
                } catch (e) {
                    showToast("Lỗi xóa vĩnh viễn", "error");
                }
            };

            const handlePlay = async (file) => {
                setLoading(true);
                try {
                    const link = await dbx.filesGetTemporaryLink({ path: file.path_lower });
                    setPlaying({ ...file, url: link.result.link, isImage: /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name) });
                } catch (e) {
                    showToast("Không thể lấy link", "error");
                } finally {
                    setLoading(false);
                }
            };

            const filtered = files.filter(f => f.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="flex flex-col h-full w-full bg-zinc-950">
                    {/* Navbar */}
                    <nav className={`h-16 min-h-[4rem] border-b flex items-center justify-between px-4 sticky top-0 z-30 backdrop-blur transition-colors duration-300 ${isTrashMode ? 'bg-red-950/30 border-red-900' : 'bg-zinc-950/95 border-zinc-800'}`}>
                        <div className="flex items-center gap-3 cursor-pointer" onClick={toggleTrash}>
                            <div className={`p-2 rounded-lg transition-colors ${isTrashMode ? 'bg-red-600 text-white' : 'text-red-600'}`}>
                                <Icon name={isTrashMode ? "trash-2" : "eye-off"} />
                            </div>
                            <div className="flex flex-col">
                                <span className="font-bold text-white text-sm sm:text-base">
                                    {isTrashMode ? "THÙNG RÁC" : "VAULT"}
                                </span>
                                <span className="text-[10px] text-zinc-500 hidden sm:block">
                                    {isTrashMode ? "Deleted Items" : "Secure Storage"}
                                </span>
                            </div>
                        </div>
                        
                        <div className="flex-1 max-w-md mx-4">
                            <div className="relative group">
                                <div className="absolute left-3 top-2.5 text-zinc-500"><Icon name="search" size={16}/></div>
                                <input 
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                    className={`w-full bg-zinc-900 border rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none transition-colors ${isTrashMode ? 'border-red-900/50 focus:border-red-500 placeholder-red-900/50' : 'border-zinc-800 focus:border-red-500'}`}
                                    placeholder={isTrashMode ? "Tìm trong thùng rác..." : "Tìm kiếm..."}
                                />
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {/* Nút chuyển đổi chế độ */}
                            <button 
                                onClick={toggleTrash}
                                className={`p-2 rounded-full transition-all ${isTrashMode ? 'text-white bg-zinc-800 hover:bg-zinc-700' : 'text-zinc-400 hover:text-red-500 hover:bg-zinc-900'}`}
                                title={isTrashMode ? "Quay lại" : "Thùng rác"}
                            >
                                <Icon name={isTrashMode ? "corner-up-left" : "trash-2"} size={20}/>
                            </button>

                            {/* Upload Button - Chỉ hiện khi KHÔNG PHẢI chế độ Trash */}
                            {!isTrashMode && (
                                <>
                                    <input type="file" ref={fileInput} onChange={handleUpload} className="hidden" accept="video/*,image/*" />
                                    <button disabled={uploading} onClick={() => fileInput.current.click()} className="bg-white text-black p-2 rounded-full transition-transform active:scale-95 hover:bg-zinc-200">
                                        {uploading ? <div className="loader w-4 h-4 !border-black !border-t-transparent"></div> : <Icon name="upload-cloud" size={20}/>}
                                    </button>
                                </>
                            )}
                            
                            <button onClick={onLogout} className="p-2 text-zinc-400 hover:text-red-500 ml-1">
                                <Icon name="power" size={20}/>
                            </button>
                        </div>
                    </nav>

                    {/* Content Grid */}
                    <main className="flex-1 p-4 overflow-y-auto relative">
                        {isTrashMode && (
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-900 via-red-600 to-red-900 opacity-50"></div>
                        )}
                        
                        {loading && !playing ? (
                            <div className="flex flex-col items-center justify-center h-64 text-zinc-500"><Loading /><p className="text-xs animate-pulse mt-2">LOADING...</p></div>
                        ) : (
                            <>
                                {filtered.length === 0 && (
                                    <div className="flex flex-col items-center justify-center h-64 text-zinc-600">
                                        <Icon name={isTrashMode ? "trash" : "ghost"} size={48} className="mb-2 opacity-20"/>
                                        <p className="text-sm opacity-50">{isTrashMode ? "Thùng rác trống" : "Không có dữ liệu"}</p>
                                    </div>
                                )}
                                <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {filtered.map(file => (
                                        <div key={file.id} className={`group bg-zinc-900 border rounded-lg overflow-hidden relative transition-all hover:shadow-lg ${isTrashMode ? 'border-red-900/30 hover:border-red-500/50' : 'border-zinc-800 hover:border-zinc-600'}`}>
                                            <div onClick={() => handlePlay(file)} className="aspect-square sm:aspect-video bg-black flex items-center justify-center cursor-pointer relative overflow-hidden">
                                                
                                                {/* THUMBNAIL COMPONENT */}
                                                <FileThumbnail dbx={dbx} file={file} />

                                                {/* Overlays */}
                                                <div className="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-all flex items-center justify-center">
                                                    <div className="bg-black/50 backdrop-blur-sm p-3 rounded-full group-hover:scale-110 transition-transform duration-300 border border-white/10">
                                                        <Icon name={/\.(jpg|png|gif)$/i.test(file.name) ? "image" : "play"} className="text-white" size={24} fill="white" />
                                                    </div>
                                                </div>
                                                
                                                {isTrashMode && (
                                                    <div className="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm">
                                                        DELETED
                                                    </div>
                                                )}

                                                <div className="absolute bottom-2 right-2 bg-black/80 backdrop-blur text-[10px] text-zinc-300 px-1.5 py-0.5 rounded font-mono border border-white/10">
                                                    {(file.size / (1024*1024)).toFixed(1)}MB
                                                </div>
                                            </div>
                                            
                                            <div className="p-3 bg-zinc-900/95 backdrop-blur">
                                                <div className="flex flex-col gap-2">
                                                    <h3 className="text-xs font-medium text-zinc-300 truncate w-full" title={file.name}>{file.name}</h3>
                                                    
                                                    <div className="flex justify-end items-center gap-2 pt-1 border-t border-zinc-800 mt-1">
                                                        {isTrashMode ? (
                                                            // ACTIONS TRONG THÙNG RÁC
                                                            <>
                                                                <button 
                                                                    onClick={(e) => {e.stopPropagation(); restoreFile(file)}} 
                                                                    className="text-green-500 hover:text-green-400 text-[10px] uppercase font-bold flex items-center gap-1 px-2 py-1 bg-green-900/20 rounded hover:bg-green-900/40 transition-colors"
                                                                >
                                                                    <Icon name="rotate-ccw" size={12} /> Restore
                                                                </button>
                                                                <button 
                                                                    onClick={(e) => {e.stopPropagation(); permanentDelete(file.path_lower)}} 
                                                                    className="text-red-500 hover:text-red-400 p-1 bg-red-900/10 rounded hover:bg-red-900/30"
                                                                    title="Xóa vĩnh viễn"
                                                                >
                                                                    <Icon name="trash-2" size={14} />
                                                                </button>
                                                            </>
                                                        ) : (
                                                            // ACTIONS BÌNH THƯỜNG
                                                            <button 
                                                                onClick={(e) => {e.stopPropagation(); moveToTrash(file)}} 
                                                                className="text-zinc-500 hover:text-red-500 flex items-center gap-1 text-[10px] hover:bg-zinc-800 px-2 py-1 rounded transition-colors ml-auto"
                                                            >
                                                                <Icon name="trash" size={12} /> Delete
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </main>

                    {/* Player/Viewer Overlay */}
                    {playing && (
                        <div className="fixed inset-0 z-[100] bg-black flex flex-col animate-in fade-in duration-200">
                            <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-start z-20 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
                                <h3 className="text-sm font-mono text-white/80 truncate max-w-[70%] drop-shadow-md pointer-events-auto bg-black/20 backdrop-blur px-2 py-1 rounded">
                                    {playing.name} {isTrashMode && <span className="text-red-500 font-bold ml-2">[PREVIEW ONLY]</span>}
                                </h3>
                                <button 
                                    onClick={() => setPlaying(null)} 
                                    className="pointer-events-auto bg-red-600/90 hover:bg-red-600 text-white p-2 rounded-full shadow-lg backdrop-blur transition-transform active:scale-95 flex items-center justify-center"
                                >
                                    <Icon name="x" size={24}/>
                                </button>
                            </div>

                            <div className="flex-1 w-full h-full flex items-center justify-center bg-black relative">
                                {playing.isImage ? (
                                    <img 
                                        src={playing.url} 
                                        className="max-w-full max-h-full object-contain" 
                                        alt="Preview"
                                    />
                                ) : (
                                    <video 
                                        controls 
                                        autoPlay 
                                        playsInline
                                        src={playing.url} 
                                        className="max-w-full max-h-full w-auto h-auto object-contain outline-none"
                                        style={{ maxHeight: '100vh', width: '100%' }} 
                                    >
                                    </video>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
